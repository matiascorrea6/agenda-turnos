# Levanta SQL Server y la API. El front se corre aparte con `npm start` en frontend/.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Agenda_Local_2026!"   # solo para desarrollo local
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Agenda_Local_2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  api:
    build: ./backend/AgendaTurnos.Api
    environment:
      ConnectionStrings__Agenda: "Server=sqlserver,1433;Database=AgendaTurnos;User Id=sa;Password=Agenda_Local_2026!;TrustServerCertificate=True"
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
